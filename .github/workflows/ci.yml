name: CI

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  # Runs the same checks on the temporary branch created by the merge queue.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new commit cancels the previous PR run, but merge-queue runs must finish.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx jest --ci --coverage

      - name: Build
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      # Known vulnerabilities are reported but do not block yet.
      # Make this step blocking once the dependency upgrades land (Etapa 3).
      - name: Dependency audit (non-blocking)
        run: npm audit --omit=dev
        continue-on-error: true
